insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
set theme="/boot/grub/live-theme/theme.txt"
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set default="ValantiaOS custom kernel"
set timeout=10

menuentry 'ValantiaOS V.alpha.placeholder custom kernel' --id 'ValantiaOS custom kernel' {
    linux /live/vmlinuz-7.2.12-valantia-kern boot=live components quiet splash console=ttyS0,115200n8
    initrd /live/initrd.img-7.2.12-valantia-kern
}
menuentry 'ValantiaOS V.alpha.placeholder custom kernel (fail-safe)' --id 'ValantiaOS custom kernel failsafe' {
    linux /live/vmlinuz-7.2.12-valantia-kern boot=live components nomodeset noapic noacpi nosplash console=ttyS0,115200n8
    initrd /live/initrd.img-7.2.12-valantia-kern
}
menuentry 'ValantiaOS V.alpha.placeholder Debian fallback kernel' --id 'ValantiaOS Debian fallback' {
    linux /live/vmlinuz boot=live components quiet splash console=ttyS0,115200n8
    initrd /live/initrd.img
}
