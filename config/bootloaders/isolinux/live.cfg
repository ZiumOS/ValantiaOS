label live
  menu label ^ValantiaOS V.alpha.placeholder custom kernel
  menu default
  kernel /live/vmlinuz-7.2.12-valantia-kern
  append initrd=/live/initrd.img-7.2.12-valantia-kern boot=live components quiet splash

label live-failsafe
  menu label ValantiaOS V.alpha.placeholder custom kernel ^(fail-safe)
  kernel /live/vmlinuz-7.2.12-valantia-kern
  append initrd=/live/initrd.img-7.2.12-valantia-kern boot=live components nomodeset noapic noacpi nosplash

label live-debian-fallback
  menu label ValantiaOS V.alpha.placeholder Debian fallback kernel
  kernel /live/vmlinuz
  append initrd=/live/initrd.img boot=live components quiet splash
