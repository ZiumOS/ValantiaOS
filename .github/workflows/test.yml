name: Test ValantiaOS ISO

on:
  workflow_run:
    workflows: [Build ValantiaOS]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-artifact:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      run_id: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout source used by build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Install ISO inspection tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools p7zip-full

      - name: Check ISO files, checksums, rootfs, boot menu and kernel/initrd paths
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find artifacts -type f -name 'ValantiaOS-*.iso' ! -name ValantiaOS.iso -print -quit)"
          version_file="$(find artifacts -type f -name VERSION -print -quit)"
          sums="$(find artifacts -type f -name SHA256SUMS -print -quit)"
          [[ -n "$iso" && -n "$version_file" && -n "$sums" ]] || { echo 'ISO, VERSION, or SHA256SUMS missing' >&2; exit 1; }
          version="$(cat "$version_file")"
          [[ "$version" == V.alpha.* ]]
          [[ "$(basename "$iso")" == "ValantiaOS-${version}-amd64.iso" ]]
          bytes="$(stat -c '%s' "$iso")"
          (( bytes >= 100000000 && bytes <= 10000000000 ))
          (cd "$(dirname "$sums")" && sha256sum --check "$(basename "$sums")")
          python3 scripts/smoke-test-iso.py "$iso" --version "$version"
          iso_list="$(xorriso -indev "$iso" -find /live -type f -print 2>&1)"
          printf '%s\n' "$iso_list"
          grep -Eq '/live/vmlinuz-7\.2\.12-valantia-kern$' <<<"$iso_list"
          grep -Eq '/live/initrd.img-7\.2\.12-valantia-kern$' <<<"$iso_list"
          grep -Eq '/live/vmlinuz$' <<<"$iso_list"
          grep -Eq '/live/initrd.img$' <<<"$iso_list"
          mkdir -p /tmp/valantia-iso-check
          xorriso -osirrox on -indev "$iso" -extract /boot/grub/grub.cfg /tmp/valantia-iso-check/grub.cfg >/dev/null 2>&1
          grep -q 'ValantiaOS custom kernel' /tmp/valantia-iso-check/grub.cfg
          grep -q 'ValantiaOS Debian fallback kernel' /tmp/valantia-iso-check/grub.cfg
          grep -q '/live/initrd.img-7.2.12-valantia-kern' /tmp/valantia-iso-check/grub.cfg
          theme="$(xorriso -indev "$iso" -find /boot/grub -name theme.txt -print 2>&1)"
          grep -q 'theme.txt' <<<"$theme"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version; ISO size=$bytes bytes"

  qemu-ovmf-boot-test:
    needs: [verify-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the ISO artifact from build run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-artifact.outputs.run_id }}
          name: ValantiaOS-${{ needs.verify-artifact.outputs.version }}-amd64
          path: iso

      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install QEMU, OVMF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf tesseract-ocr python3-pil

      - name: Boot UEFI ISO and verify GRUB, greeter, and desktop
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find iso -type f -name 'ValantiaOS-*.iso' -print -quit)"
          [[ -n "$iso" ]]
          ovmf_code="$(find /usr/share/OVMF -type f \( -iname '*CODE*.fd' -o -iname 'OVMF.fd' \) -print -quit)"
          ovmf_vars="$(find /usr/share/OVMF -type f -iname '*VARS*.fd' -print -quit)"
          [[ -n "$ovmf_code" && -n "$ovmf_vars" ]] || { echo 'OVMF firmware files not found' >&2; exit 1; }
          cp "$ovmf_vars" OVMF_VARS.fd
          cat > qmp.py <<'PY'
          import json, socket, sys
          command = sys.argv[1]
          args = json.loads(sys.argv[2]) if len(sys.argv) > 2 else {}
          sock = socket.socket(socket.AF_UNIX)
          sock.settimeout(15)
          sock.connect('qemu-qmp.sock')
          stream = sock.makefile('rwb', buffering=0)
          stream.readline()
          stream.write(b'{"execute":"qmp_capabilities"}\n')
          stream.readline()
          stream.write(json.dumps({'execute': command, 'arguments': args}).encode() + b'\n')
          while True:
              response = json.loads(stream.readline())
              if 'return' in response:
                  break
              if 'error' in response:
                  raise SystemExit(response['error'])
          sock.close()
          PY
          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 4096 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -display vnc=:1 -serial file:qemu-serial.log -monitor none \
            -qmp unix:qemu-qmp.sock,server=on,wait=off \
            -no-reboot -no-shutdown -cdrom "$iso" -boot d -vga std \
            >qemu-stderr.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT
          capture() { python3 qmp.py screendump "{\"filename\":\"$1\"}"; }
          wait_for_ocr() {
            local image=$1 pattern=$2 seconds=$3
            for _ in $(seq "$seconds"); do
              capture "$image"
              tesseract "$image" "${image%.ppm}" 2>/dev/null || true
              if grep -Eqi "$pattern" "${image%.ppm}.txt"; then return 0; fi
              sleep 1
            done
            echo "Timed out waiting for screen text: $pattern" >&2
            return 1
          }
          for _ in $(seq 60); do
            capture grub.ppm && break
            sleep 1
          done
          test -s grub.ppm || { echo 'QMP could not capture initial GRUB screen' >&2; exit 1; }
          tesseract grub.ppm grub 2>/dev/null || true
          grep -Eqi 'ValantiaOS' grub.txt || { echo 'GRUB screenshot OCR did not find ValantiaOS' >&2; exit 1; }
          cp grub.ppm grub-menu.ppm
          cp grub.txt grub-menu.txt
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('grub.ppm').convert('RGB')
          pixels = list(image.getdata())
          black = sum(1 for r, g, b in pixels if max(r, g, b) < 12)
          colored = sum(1 for r, g, b in pixels if max(r, g, b) - min(r, g, b) > 24 and max(r, g, b) > 40)
          black_ratio = black / len(pixels)
          color_ratio = colored / len(pixels)
          print(f'GRUB pixel check: black={black_ratio:.1%}; colored={color_ratio:.1%}')
          if black_ratio > 0.92 or color_ratio < 0.01:
              raise SystemExit('GRUB screenshot is black/plain; theme visuals not detected')
          PY
          python3 qmp.py send-key '{"keys":[{"key":"ret"}]}'
          wait_for_ocr boot-greeter.ppm 'login|password|Applications|Places|Valantia' 240
          cp boot-greeter.ppm boot-stage.ppm
          cp boot-greeter.txt boot-stage.txt
          if grep -Eqi 'error:|not found' qemu-serial.log qemu-stderr.log; then
            echo 'Boot serial/stderr contains error: or not found' >&2
            exit 1
          fi
          grep -Eqi 'Linux version 7\.2\.12-valantia-kern|7\.2\.12-valantia-kern' qemu-serial.log qemu-stderr.log || { echo 'Custom Valantia kernel was not confirmed in serial/stderr logs' >&2; exit 1; }
          guest_ok=0
          for _ in $(seq 240); do
            capture desktop.ppm
            tesseract desktop.ppm desktop 2>/dev/null || true
            if grep -Eqi 'error:|not found' qemu-serial.log qemu-stderr.log; then
              echo 'Boot serial/stderr contains error: or not found' >&2
              exit 1
            fi
            if grep -q 'GUEST_CHECKS_COMPLETE PASS' qemu-serial.log; then guest_ok=1; break; fi
            if grep -q 'GUEST_CHECKS_COMPLETE FAIL' qemu-serial.log; then break; fi
            sleep 1
          done
          grep 'GUEST_CHECK' qemu-serial.log > guest-check-results.txt || true
          [[ "$guest_ok" -eq 1 ]] || { cat guest-check-results.txt; echo 'Desktop guest checks did not complete successfully' >&2; exit 1; }
          grep -Eqi 'Applications|Places' desktop.txt || { echo 'Desktop screenshot does not show XFCE panel text' >&2; exit 1; }
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('desktop.ppm').convert('RGB')
          pixels = list(image.getdata())
          colored = sum(1 for r, g, b in pixels if max(r, g, b) - min(r, g, b) > 24 and max(r, g, b) > 40)
          ratio = colored / len(pixels)
          print(f'Desktop colored-pixel ratio: {ratio:.1%}')
          if ratio < 0.01:
              raise SystemExit('Desktop screenshot appears blank/black')
          PY
          echo 'PASS: GRUB theme, kernel boot, live XFCE checks, and desktop screenshot.'

      - name: Write test summary
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.verify-artifact.outputs.version }}
        run: |
          {
            echo '## ValantiaOS ISO test results'
            echo "Test run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo "ISO version: ${VERSION}"
            if [[ "${{ job.status }}" == success ]]; then
              echo '- GRUB OCR and theme pixels: PASS'
              echo '- QMP Enter boot, kernel, and serial checks: PASS'
              echo '- Guest XFCE checks and desktop screenshot: PASS'
            else
              echo '- QEMU/visual/guest checks: FAIL or incomplete; inspect logs and available screenshots'
            fi
            echo "- Evidence artifact: qemu-ovmf-evidence-${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QEMU boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ovmf-evidence-${{ needs.verify-artifact.outputs.version }}
          path: |
            qemu-serial.log
            qemu-stderr.log
            grub-menu.ppm
            grub-menu.txt
            boot-stage.ppm
            boot-stage.txt
            desktop.ppm
            desktop.txt
            guest-check-results.txt
          if-no-files-found: ignore
          retention-days: 7

  update-readme:
    needs: [verify-artifact, qemu-ovmf-boot-test]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Update test status badge
        env:
          VERSION: ${{ needs.verify-artifact.outputs.version }}
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export TESTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          start, end = '<!-- TEST-STATUS:START -->', '<!-- TEST-STATUS:END -->'
          if start not in text or end not in text:
              raise SystemExit('README test status markers are missing')
          version = os.environ['VERSION']
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['TEST_RUN_ID']}"
          section = f'''{start}
          ![Tested](https://img.shields.io/badge/tested-passed-brightgreen)

          **Tested ISO:** `ValantiaOS V.({version.removeprefix('V.alpha.')})`<br>
          **Passing test and evidence:** [Test ValantiaOS ISO run]({url})<br>
          **Artifact:** `qemu-ovmf-evidence-{version}` in the passing test run.<br>
          **Tests passed (UTC):** `{os.environ['TESTED_AT']}`
          {end}'''
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          path.write_text(before + section + after)
          PY
      - name: Commit README status
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update test status [skip ci]'
            git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"
          fi
