
name: Build ValantiaOS Gaming

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: valantiaos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Debian Live ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update

              DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends \
                  live-build ca-certificates python3-pil fonts-dejavu-core

              # Generate branded splash image
              python3 branding/grub/make-splash.py
              
              # Start from Debian's original GRUB bootloader files
              mkdir -p config/bootloaders/grub-pc
              cp -a /usr/share/live/build/bootloaders/grub-pc/. \
                config/bootloaders/grub-pc/
              
              # Install ValantiaOS background
              cp branding/grub/splash.png \
                config/bootloaders/grub-pc/splash.png
              
              # Brand the existing GRUB theme without replacing its boot entries
              python3 - <<'PY'
              from pathlib import Path
              
              p = Path("config/bootloaders/grub-pc/live-theme/theme.txt")
              s = p.read_text()
              
              replacements = {
                  "title-text": '"VALANTIAOS"',
                  "title-color": '"#F5F6FF"',
              }
              
              for key, value in replacements.items():
                  import re
                  pattern = rf"(?m)^\s*{re.escape(key)}\s*:.*$"
                  line = f"{key}: {value}"
              
                  if re.search(pattern, s):
                      s = re.sub(pattern, line, s)
                  else:
                      s += f"\n{line}\n"
              
              p.write_text(s)
              print("Applied ValantiaOS GRUB branding.")
              PY

              lb config \
                --distribution trixie \
                --architectures amd64 \
                --binary-image iso-hybrid \
                --archive-areas \
                  "main contrib non-free non-free-firmware" \
                --apt-recommends false

              lb build

              test -s live-image-amd64.hybrid.iso

              mkdir -p output

              cp live-image-amd64.hybrid.iso \
                output/ValantiaOS-Gaming-0.1.0-amd64.iso

              cd output

              sha256sum \
                ValantiaOS-Gaming-0.1.0-amd64.iso \
                > SHA256SUMS
            '

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ValantiaOS-Gaming-0.1.0-amd64
          path: |
            output/ValantiaOS-Gaming-0.1.0-amd64.iso
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
