
name: Build ValantiaOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "branding/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: valantiaos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache upstream kernel source
        uses: actions/cache@v4
        with:
          path: .cache/linux-7.2.12/linux-7.2.12.tar.xz
          key: linux-source-7.2.12-${{ runner.os }}-${{ runner.arch }}

      - name: Build Debian Live ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail scripts/build-iso.sh

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ValantiaOS-0.1.0-amd64
          path: |
            output/ValantiaOS-0.1.0-amd64.iso
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
